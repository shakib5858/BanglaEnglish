<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">

<title>AI Social Poster Studio</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f1f5f9;
  --card:#fff;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --primary:#2563eb;
}

body{
  margin:0;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Bengali",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  height:62px;
  background:#0b1220;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#38bdf8,#6366f1);
}

.brand b{
  font-size:15px;
}

.brand small{
  display:block;
  color:#94a3b8;
  font-size:10px;
}

.headerBtn{
  border:1px solid #ffffff22;
  background:#ffffff0d;
  color:white;
  padding:9px 12px;
  border-radius:10px;
}

/* LAYOUT */

.workspace{
  display:grid;
  grid-template-columns:320px 1fr 280px;
  gap:0;
  min-height:calc(100vh - 62px);
}

.sidebar{
  background:var(--card);
  border-right:1px solid var(--line);
  padding:15px;
  overflow:auto;
}

.rightbar{
  background:var(--card);
  border-left:1px solid var(--line);
  padding:15px;
  overflow:auto;
}

h3{
  margin:4px 0 13px;
  font-size:14px;
}

label{
  display:block;
  font-size:11px;
  font-weight:700;
  margin:12px 0 6px;
}

textarea,
input,
select{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:white;
  color:var(--text);
  outline:none;
  font-family:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

/* CANVAS AREA */

.canvasArea{
  padding:25px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;
  background:
    radial-gradient(circle at 50% 20%,#fff,#e2e8f0);
  overflow:auto;
}

.canvasWrap{
  background:#cbd5e1;
  padding:15px;
  border-radius:15px;
  box-shadow:0 20px 60px #0f172a22;
}

#poster{
  display:block;
  max-width:min(100%,700px);
  height:auto;
  background:white;
}

.canvasInfo{
  color:var(--muted);
  font-size:11px;
}

/* BUTTONS */

button{
  cursor:pointer;
  font-family:inherit;
}

.primary{
  width:100%;
  padding:12px;
  border:0;
  border-radius:11px;
  background:var(--primary);
  color:white;
  font-weight:700;
}

.secondary{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:11px;
  background:white;
  color:var(--text);
}

.row{
  display:flex;
  gap:7px;
}

.row>*{
  flex:1;
}

.color{
  height:42px;
  padding:3px;
}

/* TEMPLATES */

.templates{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.template{
  height:70px;
  border-radius:10px;
  border:2px solid transparent;
  overflow:hidden;
  position:relative;
  color:white;
  font-size:10px;
  font-weight:700;
}

.template.active{
  border-color:#2563eb;
}

.t1{background:linear-gradient(135deg,#111827,#2563eb)}
.t2{background:linear-gradient(135deg,#7c2d12,#f97316)}
.t3{background:linear-gradient(135deg,#14532d,#22c55e)}
.t4{background:linear-gradient(135deg,#581c87,#ec4899)}
.t5{background:linear-gradient(135deg,#0f172a,#334155)}
.t6{background:linear-gradient(135deg,#7f1d1d,#ef4444)}

.template span{
  position:absolute;
  left:8px;
  bottom:7px;
}

/* AI */

.aiBox{
  padding:12px;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:12px;
  font-size:11px;
  line-height:1.6;
  margin-bottom:10px;
}

.aiResult{
  margin-top:10px;
  padding:10px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:11px;
  white-space:pre-wrap;
}

/* SLIDER */

input[type="range"]{
  padding:0;
}

/* MOBILE */

@media(max-width:1050px){

 .workspace{
  grid-template-columns:280px 1fr;
 }

 .rightbar{
  display:none;
 }

}

@media(max-width:700px){

 header{
  height:58px;
 }

 .workspace{
  display:flex;
  flex-direction:column;
 }

 .sidebar{
  order:2;
  border-right:0;
  border-top:1px solid var(--line);
 }

 .canvasArea{
  order:1;
  min-height:520px;
  padding:15px;
 }

 .canvasWrap{
  width:min(94vw,500px);
  padding:8px;
 }

 #poster{
  width:100%;
 }

}
</style>
</head>

<body>

<div class="app">

<header>

 <div class="brand">
  <div class="logo">🎨</div>
  <div>
   <b>AI Social Poster Studio</b>
   <small>বাংলা Poster Generator</small>
  </div>
 </div>

 <button
  class="headerBtn"
  onclick="downloadPoster()">
  ⬇️ Download
 </button>

</header>


<div class="workspace">


<!-- LEFT -->

<aside class="sidebar">

 <h3>🤖 AI Design Assistant</h3>

 <div class="aiBox">
  আপনার অফার/ব্যবসার তথ্য লিখুন।
  AI আপনার জন্য poster-এর headline,
  description এবং CTA সাজিয়ে দেবে।
 </div>

 <label>Poster সম্পর্কে লিখুন</label>

 <textarea
  id="aiPrompt"
  placeholder="যেমন: ঈদ উপলক্ষে আমাদের দোকানে সব পণ্যে ২০% ছাড়..."
 ></textarea>

 <label>Platform</label>

 <select id="platform" onchange="platformChanged()">
  <option value="facebook">Facebook Post</option>
  <option value="instagram">Instagram Post</option>
  <option value="story">Instagram Story</option>
  <option value="whatsapp">WhatsApp Status</option>
  <option value="youtube">YouTube Thumbnail</option>
  <option value="linkedin">LinkedIn Post</option>
 </select>

 <br><br>

 <button
  class="primary"
  onclick="generateAI()">
  ✨ AI দিয়ে Design তৈরি করুন
 </button>


 <label>Business Name</label>

 <input
  id="business"
  value="আমার ব্যবসা"
  oninput="draw()"
 >

 <label>Headline</label>

 <input
  id="headline"
  value="বিশেষ অফার!"
  oninput="draw()"
 >

 <label>Subheadline</label>

 <input
  id="subheadline"
  value="আজই কিনুন এবং সাশ্রয় করুন"
  oninput="draw()"
 >

 <label>Offer</label>

 <input
  id="offer"
  value="২০% ছাড়"
  oninput="draw()"
 >

 <label>CTA</label>

 <input
  id="cta"
  value="এখনই অর্ডার করুন"
  oninput="draw()"
 >

 <label>Phone</label>

 <input
  id="phone"
  value="০১৭০০-০০০০০০"
  oninput="draw()"
 >

 <label>Address</label>

 <input
  id="address"
  value="ঢাকা, বাংলাদেশ"
  oninput="draw()"
 >

 <label>Logo / Product Image</label>

 <input
  type="file"
  accept="image/*"
  onchange="loadImage(event)"
 >

 <br>

 <button
  class="secondary"
  onclick="clearImage()">
  🗑️ Image Remove
 </button>

</aside>


<!-- CANVAS -->

<main class="canvasArea">

 <div class="canvasWrap">

  <canvas
   id="poster"
   width="1080"
   height="1080">
  </canvas>

 </div>

 <div class="canvasInfo">
  Editable Canvas • বাংলা Text Supported • PNG/JPG Export
 </div>

</main>


<!-- RIGHT -->

<aside class="rightbar">

 <h3>🎨 Design</h3>

 <label>Template</label>

 <div class="templates">

  <button
   class="template t1 active"
   onclick="setTemplate(1,this)">
   <span>Blue</span>
  </button>

  <button
   class="template t2"
   onclick="setTemplate(2,this)">
   <span>Orange</span>
  </button>

  <button
   class="template t3"
   onclick="setTemplate(3,this)">
   <span>Green</span>
  </button>

  <button
   class="template t4"
   onclick="setTemplate(4,this)">
   <span>Pink</span>
  </button>

  <button
   class="template t5"
   onclick="setTemplate(5,this)">
   <span>Dark</span>
  </button>

  <button
   class="template t6"
   onclick="setTemplate(6,this)">
   <span>Red</span>
  </button>

 </div>


 <label>Primary Color</label>

 <input
  class="color"
  id="primaryColor"
  type="color"
  value="#2563eb"
  oninput="draw()"
 >


 <label>Font Size</label>

 <input
  type="range"
  min="40"
  max="110"
  value="75"
  id="fontSize"
  oninput="draw()"
 >


 <label>Image Size</label>

 <input
  type="range"
  min="250"
  max="600"
  value="430"
  id="imageSize"
  oninput="draw()"
 >


 <label>Export Format</label>

 <select id="format">
  <option value="png">PNG</option>
  <option value="jpeg">JPG</option>
 </select>

 <br><br>

 <button
  class="primary"
  onclick="downloadPoster()">
  📥 Poster Download
 </button>

 <br>

 <button
  class="secondary"
  onclick="resetPoster()">
  🔄 Reset
 </button>

 <div
  class="aiResult"
  id="aiResult">
  AI result এখানে দেখাবে।
 </div>

</aside>

</div>

</div>


<script>

/* ==========================
   DATA
========================== */

const canvas =
 document.getElementById("poster");

const ctx =
 canvas.getContext("2d");

let productImage=null;

let template=1;

let currentPlatform="facebook";


/* ==========================
   PLATFORM SIZE
========================== */

function platformChanged(){

 currentPlatform =
  document.getElementById("platform").value;

 const sizes={

  facebook:[1080,1080],

  instagram:[1080,1080],

  story:[1080,1920],

  whatsapp:[1080,1920],

  youtube:[1280,720],

  linkedin:[1200,1200]

 };

 const size =
  sizes[currentPlatform] ||
  sizes.facebook;

 canvas.width=size[0];
 canvas.height=size[1];

 draw();

}


/* ==========================
   TEMPLATE
========================== */

function setTemplate(number,button){

 template=number;

 document
  .querySelectorAll(".template")
  .forEach(x =>
   x.classList.remove("active")
  );

 button.classList.add("active");

 draw();

}


/* ==========================
   IMAGE
========================== */

function loadImage(event){

 const file =
  event.target.files[0];

 if(!file)return;

 const reader =
  new FileReader();

 reader.onload=function(e){

  const img =
   new Image();

  img.onload=function(){

   productImage=img;

   draw();

  };

  img.src=e.target.result;

 };

 reader.readAsDataURL(file);

}


function clearImage(){

 productImage=null;

 draw();

}


/* ==========================
   COLORS
========================== */

function colors(){

 const selected =
  document.getElementById(
   "primaryColor"
  ).value;

 if(template===1)
  return ["#0f172a",selected];

 if(template===2)
  return ["#7c2d12","#f97316"];

 if(template===3)
  return ["#052e16","#16a34a"];

 if(template===4)
  return ["#581c87","#ec4899"];

 if(template===5)
  return ["#020617","#334155"];

 if(template===6)
  return ["#450a0a","#ef4444"];

 return ["#0f172a",selected];

}


/* ==========================
   DRAW BACKGROUND
========================== */

function drawBackground(){

 const [a,b]=colors();

 const gradient =
  ctx.createLinearGradient(
   0,
   0,
   canvas.width,
   canvas.height
  );

 gradient.addColorStop(0,a);

 gradient.addColorStop(1,b);

 ctx.fillStyle=gradient;

 ctx.fillRect(
  0,
  0,
  canvas.width,
  canvas.height
 );

 /* decorative circles */

 ctx.globalAlpha=.12;

 ctx.fillStyle="#ffffff";

 for(let i=0;i<7;i++){

  ctx.beginPath();

  ctx.arc(
   Math.random()*canvas.width,
   Math.random()*canvas.height,
   50+Math.random()*180,
   0,
   Math.PI*2
  );

  ctx.fill();

 }

 ctx.globalAlpha=1;

}


/* ==========================
   DRAW IMAGE
========================== */

function drawProduct(){

 if(!productImage)return;

 const max =
  Number(
   document.getElementById(
    "imageSize"
   ).value
  );

 const ratio =
  Math.min(
   max/productImage.width,
   max/productImage.height
  );

 const w =
  productImage.width*ratio;

 const h =
  productImage.height*ratio;

 const x =
  canvas.width/2-w/2;

 const y =
  canvas.height*.40-h/2;

 /* shadow */

 ctx.save();

 ctx.shadowColor="#00000088";

 ctx.shadowBlur=35;

 ctx.shadowOffsetY=20;

 ctx.drawImage(
  productImage,
  x,
  y,
  w,
  h
 );

 ctx.restore();

}


/* ==========================
   TEXT HELPERS
========================== */

function fitText(text,maxWidth,size){

 let current=size;

 while(
  current>30 &&
  ctx.measureText(text).width>maxWidth
 ){

  current--;

  ctx.font=
   `700 ${current}px "Noto Sans Bengali",system-ui,sans-serif`;

 }

 return current;

}


function centerText(
 text,
 x,
 y,
 size,
 weight="700"
){

 ctx.font=
  `${weight} ${size}px "Noto Sans Bengali",system-ui,sans-serif`;

 ctx.textAlign="center";

 ctx.textBaseline="middle";

 ctx.fillText(
  text,
  x,
  y
 );

}


/* ==========================
   DRAW POSTER
========================== */

function draw(){

 drawBackground();

 const centerX =
  canvas.width/2;

 const primary =
  document.getElementById(
   "primaryColor"
  ).value;

 /* business */

 ctx.fillStyle="#ffffffcc";

 centerText(
  document.getElementById(
   "business"
  ).value,
  centerX,
  canvas.height*.09,
  34,
  "600"
 );


 /* headline */

 const headline =
  document.getElementById(
   "headline"
  ).value;

 let fs =
  Number(
   document.getElementById(
    "fontSize"
   ).value
  );

 ctx.fillStyle="#ffffff";

 fs =
  fitText(
   headline,
   canvas.width*.85,
   fs
  );

 centerText(
  headline,
  centerX,
  canvas.height*.20,
  fs,
  "800"
 );


 /* image */

 drawProduct();


 /* offer */

 ctx.fillStyle=
  primary;

 const offer=
  document.getElementById(
   "offer"
  ).value;

 const offerW=
  Math.min(
   canvas.width*.65,
   650
  );

 const offerH=
  125;

 ctx.beginPath();

 roundRect(
  centerX-offerW/2,
  canvas.height*.69,
  offerW,
  offerH,
  30
 );

 ctx.fill();

 ctx.fillStyle="#ffffff";

 centerText(
  offer,
  centerX,
  canvas.height*.69+
  offerH/2,
  65,
  "900"
 );


 /* subheadline */

 ctx.fillStyle="#ffffffdd";

 centerText(
  document.getElementById(
   "subheadline"
  ).value,
  centerX,
  canvas.height*.83,
  29,
  "500"
 );


 /* CTA */

 ctx.fillStyle="#ffffff";

 centerText(
  document.getElementById(
   "cta"
  ).value,
  centerX,
  canvas.height*.89,
  30,
  "700"
 );


 /* phone */

 ctx.fillStyle="#ffffffaa";

 centerText(
  document.getElementById(
   "phone"
  ).value,
  centerX,
  canvas.height*.94,
  24,
  "600"
 );


 /* address */

 ctx.fillStyle="#ffffff88";

 centerText(
  document.getElementById(
   "address"
  ).value,
  centerX,
  canvas.height*.975,
  18,
  "400"
 );

}


/* ==========================
   ROUNDED RECT
========================== */

function roundRect(
 x,y,w,h,r
){

 ctx.beginPath();

 ctx.moveTo(x+r,y);

 ctx.lineTo(x+w-r,y);

 ctx.quadraticCurveTo(
  x+w,y,
  x+w,y+r
 );

 ctx.lineTo(x+w,y+h-r);

 ctx.quadraticCurveTo(
  x+w,y+h,
  x+w-r,y+h
 );

 ctx.lineTo(x+r,y+h);

 ctx.quadraticCurveTo(
  x,y+h,
  x,y+h-r
 );

 ctx.lineTo(x,y+r);

 ctx.quadraticCurveTo(
  x,y,
  x+r,y
 );

 ctx.closePath();

}


/* ==========================
   DOWNLOAD
========================== */

function downloadPoster(){

 draw();

 const type =
  document.getElementById(
   "format"
  ).value;

 const mime =
  type==="jpeg"
  ? "image/jpeg"
  : "image/png";

 const data =
  canvas.toDataURL(
   mime,
   .95
  );

 const link =
  document.createElement("a");

 link.download =
  "social-poster."+
  type;

 link.href=data;

 link.click();

}


/* ==========================
   AI
========================== */

async function generateAI(){

 const prompt =
  document.getElementById(
   "aiPrompt"
  ).value.trim();

 if(!prompt){

  alert(
   "প্রথমে আপনার poster সম্পর্কে লিখুন।"
  );

  return;

 }

 const api =
  localStorage.getItem(
   "poster_openrouter_key"
  );

 if(!api){

  const key =
   prompt(
    "OpenRouter API Key দিন:"
   );

  if(!key)return;

  localStorage.setItem(
   "poster_openrouter_key",
   key
  );

 }

 const apiKey =
  localStorage.getItem(
   "poster_openrouter_key"
  );

 const result =
  document.getElementById(
   "aiResult"
  );

 result.textContent=
  "🤖 AI design তৈরি করছে...";

 try{

  const response =
   await fetch(
    "https://openrouter.ai/api/v1/chat/completions",
    {
     method:"POST",

     headers:{
      "Content-Type":
       "application/json",

      "Authorization":
       "Bearer "+apiKey,

      "HTTP-Referer":
       location.href,

      "X-Title":
       "AI Social Poster Studio"
     },

     body:JSON.stringify({

      model:
       "openai/gpt-oss-20b:free",

      messages:[

       {
        role:"system",
        content:`

আপনি একজন Social Media Poster Designer।

ব্যবহারকারীর দেওয়া তথ্য থেকে
বাংলা social media poster-এর
content তৈরি করুন।

শুধু এই JSON format দিন:

{
 "business":"",
 "headline":"",
 "subheadline":"",
 "offer":"",
 "cta":"",
 "suggestedStyle":""
}

বাংলা ব্যবহার করুন।
Headline ছোট রাখুন।
Offer পরিষ্কার রাখুন।
CTA আকর্ষণীয় রাখুন।

`
       },

       {
        role:"user",
        content:
         prompt+
         "\nPlatform: "+
         currentPlatform
       }

      ],

      temperature:.7,

      max_tokens:300

     })

    }
   );

  const data =
   await response.json();

  if(!response.ok){

   throw new Error(
    data?.error?.message ||
    "AI request failed"
   );

  }

  let text =
   data?.choices?.[0]?.message?.content ||
   "";

  text =
   text
    .replace(/```json/g,"")
    .replace(/```/g,"")
    .trim();

  const json =
   JSON.parse(text);

  /* Apply */

  if(json.business)
   document.getElementById(
    "business"
   ).value=json.business;

  if(json.headline)
   document.getElementById(
    "headline"
   ).value=json.headline;

  if(json.subheadline)
   document.getElementById(
    "subheadline"
   ).value=json.subheadline;

  if(json.offer)
   document.getElementById(
    "offer"
   ).value=json.offer;

  if(json.cta)
   document.getElementById(
    "cta"
   ).value=json.cta;

  result.textContent =
   "✨ Design তৈরি হয়েছে!\n\n"+
   "Style: "+
   (json.suggestedStyle || "");

  draw();

 }catch(error){

  result.textContent =
   "❌ সমস্যা: "+
   error.message;

 }

}


/* ==========================
   RESET
========================== */

function resetPoster(){

 document.getElementById(
  "business"
 ).value="আমার ব্যবসা";

 document.getElementById(
  "headline"
 ).value="বিশেষ অফার!";

 document.getElementById(
  "subheadline"
 ).value=
  "আজই কিনুন এবং সাশ্রয় করুন";

 document.getElementById(
  "offer"
 ).value="২০% ছাড়";

 document.getElementById(
  "cta"
 ).value="এখনই অর্ডার করুন";
